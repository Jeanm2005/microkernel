# Limine bootloader config. The Makefile replaces @CMDLINE@ with $(CMDLINE)
# when it builds the ISO, e.g. `make run CMDLINE="selftest=pagefault"`.
timeout: 0
serial: yes

/microkernel
    protocol: limine
    path: boot():/boot/kernel.elf
    cmdline: @CMDLINE@
    # The root task: the only user program the kernel starts. The other
    # modules are for the root task: program images and the manifests
    # that say which of them to start.
    module_path: boot():/boot/root.elf
    module_path: boot():/boot/console.elf
    module_path: boot():/boot/hello.elf
    module_path: boot():/boot/system.manifest
    module_path: boot():/boot/crash.manifest
    module_path: boot():/boot/input.manifest
